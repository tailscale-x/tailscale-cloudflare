name: Caddy gateway image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  caddy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build fixed Caddy image
        run: docker build -t caddy-gateway-check -f gateway/Dockerfile gateway
      - name: Validate Caddyfile and installer
        run: |
          docker run --rm --entrypoint caddy -e ACME_EMAIL=ci@example.com caddy-gateway-check validate --config /etc/caddy/Caddyfile
          sh -n gateway/install.sh
      - name: Sign in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and publish image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag caddy-gateway-check ghcr.io/tailscale-x/tailscale-cloudflare-caddy:${GITHUB_REF_NAME}
          docker push ghcr.io/tailscale-x/tailscale-cloudflare-caddy:${GITHUB_REF_NAME}
