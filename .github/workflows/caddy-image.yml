name: Embedded Caddy image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  caddy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unified image
        run: docker build -t caddy-node-check -f node/Dockerfile .
      - name: Check configs and installer
        run: |
          docker run --rm --entrypoint caddy -e ACME_EMAIL=ci@example.com -e TS_HOSTNAME=ci-gateway -e TS_AUTHKEY=unused caddy-node-check adapt --config /etc/caddy/gateway.Caddyfile --adapter caddyfile >/dev/null
          docker run --rm --entrypoint caddy -e TS_HOSTNAME=ci-router -e TS_AUTHKEY=unused caddy-node-check adapt --config /etc/caddy/router.Caddyfile --adapter caddyfile >/dev/null
          sh -n node/install.sh
          sh -n node/test-proxy.sh
      - name: Check Docker label routing and ingress reachability
        run: sh node/test-proxy.sh caddy-node-check
      - name: Sign in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag caddy-node-check ghcr.io/tailscale-x/tailscale-cloudflare-caddy:${GITHUB_REF_NAME}
          docker push ghcr.io/tailscale-x/tailscale-cloudflare-caddy:${GITHUB_REF_NAME}
