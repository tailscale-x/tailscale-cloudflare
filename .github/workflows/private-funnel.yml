name: private-funnel

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Generate templ and build UI assets
        run: |
          npm ci --prefix ui
          npm run build --prefix ui
          go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate ./internal/web/ui
          git diff --exit-code -- internal/web/ui/layout_templ.go internal/web/assets/app.css internal/web/assets/icons
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/tailscale-private-funnel
      - run: go build -tags caddy ./cmd/tailscale-private-funnel
      - run: go test -tags caddy ./...
      - name: Build-check the release image
        run: docker buildx build --platform linux/amd64 --file Dockerfile.private-funnel --tag private-funnel:ci .

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.private-funnel
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/tailscale-x/tailscale-private-funnel:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}

  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build native binaries
        run: |
          mkdir -p dist
          for target in linux-amd64 linux-arm64 darwin-arm64; do
            GOOS=${target%-*} GOARCH=${target#*-} CGO_ENABLED=0 go build -tags caddy -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/tailscale-private-funnel-${target}" ./cmd/tailscale-private-funnel
          done
          sha256sum dist/* > dist/SHA256SUMS
          printf '{"version":"%s","commit":"%s","image":"ghcr.io/tailscale-x/tailscale-private-funnel:%s"}\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_REF_NAME" > dist/release-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-private-funnel-binaries
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-private-funnel-binaries
          path: dist
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            docs/screenshots/control-dashboard-v1.png
